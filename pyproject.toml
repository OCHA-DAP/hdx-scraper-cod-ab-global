[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "hdx-scraper-cod-ab-global"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "duckdb",
    "fsspec",
    "geopandas",
    "geoparquet-io",
    "hdx-python-api",
    "hdx-python-country",
    "hdx-python-utilities",
    "httpx[http2]",
    "pandas",
    "portolan-cli[pmtiles]==0.8.0",
    "python-dotenv",
    "quantulum3[classifier]",
    "tenacity",
    "topo-tools>=0.5.6",
    "tqdm",
]

[dependency-groups]
dev = ["pre-commit", "pytest", "pytest-cov", "ruff", "taskipy"]

[tool.uv]
# portolan-cli 0.8.0 caps duckdb<1.5.5, but topo-tools>=0.5.4 requires
# duckdb>=1.5.5; the cap is stale packaging metadata, not a real limit.
override-dependencies = ["duckdb>=1.5.5"]

[tool.hatch]
version.source = "uv-dynamic-versioning"
build.hooks.version.path = "src/hdx/scraper/cod_ab_global/_version.py"
build.targets.wheel.packages = ["src/hdx"]

[tool.pytest.ini_options]
addopts = "--color=yes"
log_cli = true
pythonpath = "src"

[tool.ruff]
exclude = ["_version.py"]
fix = true
lint.select = ["ALL"]
lint.ignore = ["COM812", "D203", "D213", "FIX002", "S603", "S607", "S608"]

[tool.taskipy.tasks]
# uv run task app
app = "python run.py"
ruff = "ruff check && ruff format"
test = "pytest --rootdir=. --junitxml=test-results.xml --cov --no-cov-on-fail --cov-report=lcov --cov-report=term-missing"
